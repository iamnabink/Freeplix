name: pages

# Continuous deploy: every push to main republishes
# https://iamnabink.github.io/Freeplix/
on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages needs these to publish; nothing else in the repo does.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Never cancel a deploy midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        env:
          TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          FREEPLIX_SOURCES: ${{ secrets.FREEPLIX_SOURCES }}
        run: |
          flutter build web \
            --release \
            --base-href "/Freeplix/" \
            --dart-define=TMDB_API_READ_ACCESS_TOKEN="$TMDB_API_READ_ACCESS_TOKEN" \
            --dart-define=TMDB_API_KEY="$TMDB_API_KEY" \
            --dart-define=FREEPLIX_SOURCES="$FREEPLIX_SOURCES"

      - name: Prepare for static hosting
        run: |
          # Pages has no SPA rewrite, so a deep link like /Freeplix/title/movie/603
          # would 404. Serving index.html as the 404 page lets go_router take over.
          cp build/web/index.html build/web/404.html
          # Stop Jekyll from swallowing files that start with an underscore.
          touch build/web/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
